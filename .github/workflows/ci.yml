name: CI

on:
  # We run CI on pushes to the main branch
  push:
    branches:
      - main
  # and on all pull requests to the main branch
  pull_request:
    branches:
      - main
  # as well as upon manual triggers through the 'Actions' tab of the Github UI
  workflow_dispatch:

jobs:
  build-and-test:
    name: Testing on ${{matrix.os}}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Here, we are testing the oldest and the newest supported Python version.
        # If this is insufficient for your package, consider adding more versions.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        # setuptools_scm requires a non-shallow clone of the repository
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python package
      run: |
        python -m pip install setuptools
        python -m pip install .[cpu,tests]

    - name: Run Python tests
      run: |
        python -m pytest --nbval
      env:
        ILLUSTRIS_API_KEY: ${{ secrets.ILLUSTRIS_API_KEY }} # need this to run the tests

  guardrail-check:
    name: Guardrail Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Install Python package
      run: |
        python -m pip install setuptools
        python -m pip install .[cpu,tests]

    - name: Run guardrail benchmark profile
      run: |
        python bench/check_inference_guardrails.py \
          --threshold-config rubix/config/guardrail_thresholds.yml \
          --profile ci_fast \
          --output-json outputs/guardrails/opt_guardrail_ci.json

    - name: Upload guardrail report artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: guardrail-report
        path: outputs/guardrails/opt_guardrail_ci.json

  coverage:
    name: Coverage Testing
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Install Python package
      run: |
        python -m pip install setuptools
        python -m pip install -e .[cpu,tests]

    - name: Run Python tests
      working-directory: ./tests
      run: |
        python -m pytest --cov --cov-report=xml
      env:
        ILLUSTRIS_API_KEY: ${{ secrets.ILLUSTRIS_API_KEY }} # need this to run the tests

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        fail_ci_if_error: true
        files: ./tests/coverage.xml
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
