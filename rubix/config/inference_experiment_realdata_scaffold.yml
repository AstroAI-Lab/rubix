run:
  rubix_config_path: path/to/your/rubix_user_config.yml
  mode: deterministic
  smoke_only: true
  auto_resume_latest: false
  fail_on_stage_failure: false
  checkpoint_policy: standard
  seed: 0
  noise_seed: 0
  output_dir: outputs/ifu_realdata_smoke
  checkpoint_dir: outputs/ifu_realdata_smoke/checkpoints
  params_init_overrides:
    stars:
      age: [1.0]
      metallicity: [0.01]
  objective:
    kind: gaussian_nll
    inv_variance_key: inv_variance
    mask_key: mask

data:
  target_path: path/to/target_cube.npy
  target_key:
  mask_path: path/to/mask_cube.npy
  mask_key:
  weights_path:
  weights_key:
  sigma_path:
  sigma_key:
  inv_variance_path: path/to/inv_variance_cube.npy
  inv_variance_key:

optimization:
  enabled: false
  learning_rate: 0.001
  max_steps: 500
  tol: 1.0e-6
  normalize_loss: true
  checkpoint_interval_steps: 100
  resume_checkpoint: latest

variational:
  enabled: false
  learning_rate: 0.005
  max_steps: 500
  tol: 1.0e-6
  num_samples: 4
  beta_kl: 0.001
  init_log_std: -2.0
  normalize_loss: true
  huber_delta: 0.2
  huber_weight: 0.0
  checkpoint_interval_steps: 100
  resume_checkpoint: latest

predictive:
  enabled: false
  num_draws: 16
